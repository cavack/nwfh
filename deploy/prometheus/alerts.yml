groups:
  - name: waterfall
    rules:
      - alert: WaterfallBackendDown
        expr: up{job="waterfall-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Waterfall backend is unreachable
      - alert: WaterfallBackendMemoryPressure
        # The backend runs under a hard 2GiB cgroup memory limit
        # (docker-compose.yml: deploy.resources.limits.memory: 2G, confirmed
        # on the host as memory.max=2147483648). The previous 3GiB threshold
        # sat ABOVE that cap, so this alert could never fire - even while
        # memory.events recorded hundreds of thousands of limit hits.
        # 1.8GiB is 90% of the real cap: it fires with headroom left to act,
        # instead of after the kernel already started swapping the process.
        expr: process_resident_memory_bytes{job="waterfall-backend"} > 1932735283
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Waterfall backend RSS exceeds 90% of its 2 GiB limit
      - alert: WaterfallBackendMemoryGrowth
        expr: deriv(process_resident_memory_bytes{job="waterfall-backend"}[10m]) > 174763
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Waterfall backend RSS is growing faster than 10 MiB/min
      - alert: WaterfallBackendRestarted
        expr: changes(process_start_time_seconds{job="waterfall-backend"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Waterfall backend process restarted within the last 10 minutes
      - alert: WaterfallCatalogueStale
        # The catalogue refresh is 15 minutes. Twenty minutes permits network
        # jitter but detects the six-hour sleep/failed-loop failure mode before
        # a newly listed contract remains invisible for a trading session.
        expr: time() - waterfall_catalog_last_refresh_timestamp > 1200
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: LBank catalogue has not refreshed for over 20 minutes
      - alert: WaterfallHunterStalled
        # The hunter normally emits progress continuously. A three-minute gap
        # is long enough to tolerate slow REST/WS paths but short enough to
        # detect an event-loop or SQLite lock stall before the dashboard ages.
        expr: time() - waterfall_hunter_last_progress_timestamp > 180
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Waterfall hunter has made no progress for over 3 minutes
      - alert: WaterfallNotificationOutboxStuck
        expr: waterfall_notification_delivery_state_total{state=~"PENDING|RETRY_WAIT|SENDING"} > 0 and waterfall_notification_oldest_pending_age_seconds > 600
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Telegram notification outbox has a pending event older than 10 minutes
      - alert: WaterfallNotificationDeadLetter
        expr: waterfall_notification_delivery_state_total{state="DEAD_LETTER"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Telegram notification delivery reached dead letter state
      - alert: WaterfallWebSocketOrphanSubscriptions
        expr: waterfall_websocket_ccxt_subscriptions > waterfall_websocket_active_tasks + 3 * waterfall_websocket_shared_evidence_active_subscribers + 8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: CCXT WebSocket subscriptions materially exceed owned consumer tasks
      - alert: WaterfallWebSocketOrphanClients
        expr: waterfall_websocket_ccxt_clients > waterfall_websocket_ccxt_subscriptions + 8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CCXT WebSocket clients remain without corresponding subscriptions
      - alert: WaterfallWebSocketDirectIdleClients
        expr: waterfall_websocket_direct_idle_ccxt_clients > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Direct-evidence CCXT clients remain without subscriptions or pending futures
      - alert: WaterfallWebSocketRetirementBacklog
        expr: waterfall_websocket_direct_exchange_retire_tasks + waterfall_websocket_liquidation_exchange_retire_tasks + waterfall_websocket_shared_evidence_reconcile_tasks > 8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: WebSocket exchange retirement tasks are not draining
      - alert: WaterfallWebSocketExchangeCloseFinalizerStuck
        expr: waterfall_websocket_exchange_close_finalizer_tasks > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A WebSocket exchange close finalizer has remained unfinished
      - alert: WaterfallSharedWebSocketRetirementBlocked
        expr: waterfall_websocket_shared_evidence_blocked_exchanges > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Shared WebSocket replacement is blocked by unproven transport retirement

  - name: host
    rules:
      - alert: HostDiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"}
            / node_filesystem_size_bytes{mountpoint="/",fstype="ext4"} < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Root filesystem below 15% free
      - alert: HostDiskSpaceWarning
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"}
            / node_filesystem_size_bytes{mountpoint="/",fstype="ext4"} < 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Root filesystem below 25% free
      - alert: HostDiskPredictedToFill
        # This is the rule that was missing when the disk reached 95%.
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"}[6h], 86400) < 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Root filesystem projected to fill within 24 hours
      - alert: HostMemoryPressure
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host available memory below 10%
      - alert: RegistryDatabaseGrowth
        expr: |
          predict_linear(wfh_registry_bytes[24h], 30 * 86400) > 60e9
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Registry DB projected to exceed 60 GB within 30 days
