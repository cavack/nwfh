global:
  scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'waterfall-backend'
    static_configs:
      - targets: ['waterfall-backend:8000']

  - job_name: 'node'
    static_configs:
      - targets: ['wfh-node-exporter:9100']

rule_files:
  - /etc/prometheus/alerts.yml
